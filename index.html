<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Farm Simulator Calculator</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #3e3e3e;
            --accent-color: #ffffff;
            --accent-hover: #e0e0e0;
            --text-color: #ffffff;
            --text-muted: #ffffff;
            --border-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            background-color: #000000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .result-box {
            margin-top: 12px;
            margin-bottom: 16px;
            padding: 16px;
            background-color: #121214;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: left;
        }

        .result-label {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-align: center;
            font-weight: bold;
        }

        .result-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-color);
            line-height: 1.6;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <h1>Egg Farm Simulator Black Eggs Calculator</h1>

        <!-- PAGE 1: INPUT FORM -->
        <div id="inputPage">
            <p class="subtitle">Enter your Information below to Calculate your Black Eggs (BEs)</p>
            
            <h1 style="font-size: 1rem; color: var(--text-muted); margin: 16px 0 8px 0; text-align: center;">Player's Information</h1>
            <div class="input-group">
                <label for="statInput1">Black Eggs Number (BEs)</label>
                <input type="text" id="statInput1" placeholder="e.g. 2e4457">
            </div>
            <div class="input-group">
                <label for="statInput2">Water Egg Level (0 - 150)</label>
                <input type="number" step="1" min="0" max="150" oninput="if(this.value < 0) this.value = 0;" id="statInput2" placeholder="e.g. 16">
            </div>

            <h1 style="font-size: 1rem; color: var(--text-muted); margin: 16px 0 8px 0; text-align: center;">Your Current Easter Egg Levels (Optional)</h1>
            <div class="input-group">
                <label for="statInput3">Good Knight Egg (GK)</label>
                <input type="text" id="statInput3" placeholder="e.g. 2.975e4418">
            </div>
            <div class="input-group">
                <label for="statInput4">Main 7 Eggs</label>
                <input type="text" id="statInput4" placeholder="e.g. 1.32e2209">
            </div>
            <div class="input-group">
                <label for="statInput5">Turtle Egg</label>
                <input type="text" id="statInput5" placeholder="e.g. 3.270e1767">
            </div>
            <div class="input-group">
                <label for="statInput6">Miscellaneous 13 Eggs (Current Level)</label>
                <input type="number" min="0" oninput="if(this.value < 0) this.value = 0;" id="statInput6" placeholder="e.g. 14671">
            </div>

            <button type="button" onclick="calculate()">Calculate</button>
        </div>

        <!-- PAGE 2: RESULTS VIEW -->
        <div id="resultPage" class="hidden">
            <p class="subtitle">Calculation Complete</p>
            <div class="result-box">
                <div class="result-label">Recommended Target vs Needed</div>
                <div id="resultOutput" class="result-value"></div>
            </div>
            <button type="button" onclick="goBack()">← Go Back & Reset</button>
        </div>
    </div>

    <script>
        function parseScientific(str) {
            str = str.trim().toLowerCase();
            if (!str) return null;
            if (str.includes('e')) {
                let parts = str.split('e');
                let base = parseFloat(parts[0]);
                let exp = parseFloat(parts[1]);
                if (isNaN(base) || isNaN(exp) || base <= 0) return { base: 1, exp: -Infinity };
                return { base: base, exp: exp };
            } else {
                let num = parseFloat(str);
                if (isNaN(num)) return null;
                if (num <= 0) return { base: 1, exp: -Infinity };
                return { base: 1, exp: Math.log10(num) };
            }
        }

        function showInputPage() {
            document.getElementById('statInput1').value = '';
            document.getElementById('statInput2').value = '';
            document.getElementById('statInput3').value = '';
            document.getElementById('statInput4').value = '';
            document.getElementById('statInput5').value = '';
            document.getElementById('statInput6').value = '';
            document.getElementById('resultPage').classList.add('hidden');
            document.getElementById('inputPage').classList.remove('hidden');
        }

        function showResultPage() {
            document.getElementById('inputPage').classList.add('hidden');
            document.getElementById('resultPage').classList.remove('hidden');
        }

        function formatResult(targetExp, currentStr) {
            let currentParsed = parseScientific(currentStr);
            let targetExpRounded = Math.round(targetExp);
            let html = `Target: 1e${targetExpRounded}`;

            if (currentStr.trim() && currentParsed && !isNaN(currentParsed.exp)) {
                html += `<div style="font-size: 0.85rem; color: #aaa; margin-left: 12px;">Current: ${currentStr.trim()}</div>`;

                let currentTotalExp = currentParsed.exp + Math.log10(currentParsed.base);
                let expDiff = targetExp - currentTotalExp;

                if (expDiff <= 0) {
                    html += `<div style="font-size: 0.85rem; color: #4cd137; margin-left: 12px;">Status: Target Reached! ✅</div>`;
                } else if (expDiff < 15) {
                    let factor = 1 - Math.pow(10, -expDiff);
                    let diffExp = targetExp + Math.log10(factor);
                    let wholeExp = Math.floor(diffExp);
                    let mantissa = Math.pow(10, diffExp - wholeExp);

                    let formattedDiff = wholeExp < 6 
                        ? Math.round(Math.pow(10, diffExp)).toLocaleString() 
                        : `${mantissa.toFixed(2)}e${wholeExp}`;

                    html += `<div style="font-size: 0.85rem; color: #00d2d3; margin-left: 12px;">Amount to Add: ${formattedDiff}</div>`;
                } else {
                    html += `<div style="font-size: 0.85rem; color: #00d2d3; margin-left: 12px;">Amount to Add: ~1e${targetExpRounded} (Current is negligible)</div>`;
                }
            }
            return html;
        }

        function calculate() {
            let besInput = document.getElementById('statInput1').value;
            let waterEggLevel = parseFloat(document.getElementById('statInput2').value) || 0;
            let gkCurrent = document.getElementById('statInput3').value;
            let main7Current = document.getElementById('statInput4').value;
            let turtleCurrent = document.getElementById('statInput5').value;
            let miscCurrentLevel = parseFloat(document.getElementById('statInput6').value) || 0;

            let besParsed = parseScientific(besInput);
            if (!besParsed || isNaN(besParsed.exp)) {
                alert("Please enter a valid Black Eggs (BEs) number.");
                return;
            }

            let totalExpBE = besParsed.exp + Math.log10(besParsed.base);
            
            let waterEggDiscountPercent = 100 * (1 - Math.pow(0.95, waterEggLevel));
            let waterEggMultiplier = 1 - (waterEggDiscountPercent / 100);

            let expGK = totalExpBE + Math.log10(0.2);
            let main7Exp = (expGK - 1) / 2;
            let turtleExp = main7Exp * 0.8;

            let miscExpPerEgg = totalExpBE + Math.log10(0.10 / 13);
            let effectiveMiscExp = miscExpPerEgg - Math.log10(waterEggMultiplier);
            
            let miscTargetLevel = Math.floor((effectiveMiscExp / Math.log10(2)) - 1);
            let miscLevelsNeeded = miscTargetLevel - miscCurrentLevel;

            let miscHtml = `Target Level: ${miscTargetLevel.toLocaleString()}`;
            if (document.getElementById('statInput6').value.trim() !== '') {
                miscHtml += `<div style="font-size: 0.85rem; color: #aaa; margin-left: 12px;">Current Level: ${miscCurrentLevel.toLocaleString()}</div>`;
                if (miscLevelsNeeded <= 0) {
                    miscHtml += `<div style="font-size: 0.85rem; color: #4cd137; margin-left: 12px;">Status: Target Reached! ✅</div>`;
                } else {
                    miscHtml += `<div style="font-size: 0.85rem; color: #00d2d3; margin-left: 12px;">Levels to Add: +${miscLevelsNeeded.toLocaleString()}</div>`;
                }
            }

            let html = `
                <div style="margin-bottom: 10px;">• <strong>Good Knight:</strong><br>${formatResult(expGK, gkCurrent)}</div>
                <div style="margin-bottom: 10px;">• <strong>Main 7:</strong><br>${formatResult(main7Exp, main7Current)}</div>
                <div style="margin-bottom: 10px;">• <strong>Turtle:</strong><br>${formatResult(turtleExp, turtleCurrent)}</div>
                <div style="margin-bottom: 10px;">• <strong>Misc 13 (each):</strong><br>${miscHtml}</div>
                <div style="margin-top: 12px; font-size: 0.85rem; color: #ccc; border-top: 1px solid #444; padding-top: 8px;">Water Egg Level ${waterEggLevel}: ${waterEggDiscountPercent.toFixed(2)}% upgrade cost discount applied.</div>
            `;

            document.getElementById('resultOutput').innerHTML = html;
            showResultPage();
            history.pushState({ page: 'results' }, '', '#results');
        }

        function goBack() {
            history.back();
        }

        window.addEventListener('popstate', function(event) {
            if (event.state && event.state.page === 'results') {
                showResultPage();
            } else {
                showInputPage();
            }
        });

        if (window.location.hash === '#results') {
            history.replaceState(null, '', window.location.pathname);
        }
    </script>

</body>
</html>
