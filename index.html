<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Farm Simulator Calculator</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #3e3e3e;
            --accent-color: #ffffff;
            --accent-hover: #ffffff;
            --text-color: #ffffff;
            --text-muted: #ffffff;
            --border-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            background-color: #000000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .result-box {
            margin-top: 24px;
            padding: 16px;
            background-color: #121214;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: left;
        }

        .result-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-align: center;
            font-weight: bold;
        }

        .result-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-color);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <h1>Egg Farm Simulator Black Eggs Calculator</h1>
        <p class="subtitle">Enter your Information below to Calculate your Black Eggs (BE)</p>

        <form id="calcForm">
            <h1 style="font-size: 1rem; color: var(--text-muted); margin: 16px 0 8px 0; text-align: center;">Player's Information</h1>
            <div class="input-group">
                <label for="statInput1">Black Eggs Number (BEs)</label>
                <input type="text" id="statInput1" placeholder="e.g. 1e44" required>
            </div>
            <div class="input-group">
                <label for="statInput2">Water Egg (%)</label>
                <input type="number" id="statInput2" placeholder="Decimal Value (e.g. 0.05)" required>
            </div>

            <h1 style="font-size: 1rem; color: var(--text-muted); margin: 16px 0 8px 0; text-align: center;">Your Current Easter Egg Levels</h1>
            <div class="input-group">
                <label for="statInput3">Good Knight Egg (GK)</label>
                <input type="text" id="statInput3" placeholder="e.g. 1e44" required>
            </div>
            <div class="input-group">
                <label for="statInput4">Main 7 Eggs</label>
                <input type="text" id="statInput4" placeholder="e.g. 1e44" required>
            </div>
            <div class="input-group">
                <label for="statInput5">Turtle Egg</label>
                <input type="text" id="statInput5" placeholder="e.g. 1e44" required>
            </div>
            <div class="input-group">
                <label for="statInput6">Miscellaneous 13 Eggs</label>
                <input type="number" id="statInput6" placeholder="e.g. 222" required>
            </div>

            <button type="button" onclick="calculate()">Calculate</button>
        </form>

        <div class="result-box">
            <div class="result-label">Recommended Black Eggs (BEs)</div>
            <div id="resultOutput" class="result-value">Enter the Values above & Click Calculate.</div>
        </div>
    </div>

    <script>
        function parseValue(val) {
            // Parses standard numbers or scientific notation strings like "1e44"
            return parseFloat(val);
        }

        function formatExp(num) {
            if (isNaN(num)) return "Invalid";
            let exp = Math.log10(num);
            return `1e${exp.toFixed(2)}`;
        }

        function calculate() {
            let besVal = parseValue(document.getElementById('statInput1').value);
            let waterEgg = parseValue(document.getElementById('statInput2').value) || 0;
            let gkCurrent = parseValue(document.getElementById('statInput3').value);
            let main7Current = parseValue(document.getElementById('statInput4').value);
            let turtleCurrent = parseValue(document.getElementById('statInput5').value);
            let miscCurrent = parseValue(document.getElementById('statInput6').value);

            if (isNaN(besVal)) {
                document.getElementById('resultOutput').innerText = "Please enter a valid Black Eggs (BEs) number.";
                return;
            }

            // Rule 2: GoodKnight = 20% (1/5th) of Total BEs
            let gkTarget = besVal * 0.2;
            let expGK = Math.log10(gkTarget);

            // Rule 3: Main7 = (GK exponent - 1) / 2
            let main7Exp = (expGK - 1) / 2;
            let main7Target = Math.pow(10, main7Exp);

            // Rule 4: Turtle = Main7 exponent * 80%
            let turtleExp = main7Exp * 0.8;
            let turtleTarget = Math.pow(10, turtleExp);

            // Display results
            let html = `
                <div>• <strong>Good Knight BEs:</strong> ${formatExp(gkTarget)}</div>
                <div>• <strong>Main 7 BEs:</strong> ${formatExp(main7Target)}</div>
                <div>• <strong>Turtle BEs:</strong> ${formatExp(turtleTarget)}</div>
                <div style="margin-top: 6px; font-size: 0.85rem; color: #aaa;">Water Egg Bonus: +${(waterEgg * 100)}% distributed across eggs.</div>
            `;

            document.getElementById('resultOutput').innerHTML = html;
        }
    </script>

</body>
</html>
